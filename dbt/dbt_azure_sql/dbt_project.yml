name: dbt_azure_sql
version: "1.0.0"
config-version: 2

profile: dbt_azure_sql

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_azure_sql:
    salts:
      +schema: salts
      source:
        +materialized: ephemeral
      staging:
        +materialized: ephemeral
      marts:
        +materialized: view
