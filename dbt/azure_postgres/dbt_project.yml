name: helioscta_platform
version: "0.1.0"
config-version: 2

profile: helioscta_platform

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  helioscta_platform:
    +enabled: false
    positions_and_trades:
      "2026_07_22_ref_tables":
        utils:
          +enabled: true
          +schema: positions_and_trades_ref_tables
          +materialized: ephemeral
        clear_street_eod_transactions:
          +enabled: true
          +schema: positions_and_trades_ref_tables
          +materialized: ephemeral
        nav_positions:
          +enabled: true
          +schema: positions_and_trades_ref_tables
          +materialized: ephemeral
    pjm_da_model:
      ice_python:
        +enabled: true
        +schema: pjm_da_model_ice_python
        +materialized: ephemeral
        settlements:
          +enabled: true
          +schema: pjm_da_model_ice_python
          +materialized: ephemeral
      meteologica:
        +enabled: true
        +schema: pjm_da_model_meteologica
        +materialized: ephemeral
        da_price_forecast:
          +enabled: true
          +schema: pjm_da_model_meteologica
          +materialized: ephemeral
        pjm_forecast_hourly:
          +enabled: true
          +schema: pjm_da_model_meteologica
          +materialized: ephemeral
      pjm:
        +enabled: true
        +schema: pjm_da_model_pjm
        +materialized: ephemeral
        da_lmps_hourly:
          +enabled: true
          +schema: pjm_da_model_pjm
          +materialized: ephemeral
        gen_by_fuel:
          +enabled: true
          +schema: pjm_da_model_pjm
          +materialized: ephemeral
        gen_outages:
          +enabled: true
          +schema: pjm_da_model_pjm
          +materialized: ephemeral
        load_forecast_hourly:
          +enabled: true
          +schema: pjm_da_model_pjm
          +materialized: ephemeral
        rto_load_hourly:
          +enabled: true
          +schema: pjm_da_model_pjm
          +materialized: ephemeral
      weather:
        +enabled: true
        +schema: pjm_da_model_weather
        +materialized: ephemeral
        wsi_hourly_temperature:
          +enabled: true
          +schema: pjm_da_model_weather
          +materialized: ephemeral
